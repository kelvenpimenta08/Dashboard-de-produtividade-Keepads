<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepads · Painel de Produtividade</title>
<link rel="icon" href="https://keepads.com.br/logos/header-logo.webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1dd1a1;--green-light:#e8f8f2;--green-mid:#a8dfc8;--green-dark:#15a883;
  --bg:#f5f5f5;--surface:#fff;--border:#ebebeb;--border2:#d8d8d8;
  --text:#1a1a1a;--text2:#555555;--muted:#9a9a9a;
  --red:#ff3b30;--orange:#ff6d00;--yellow:#c08a0e;--purple:#6d48d6;--blue:#2b6cb0;
  --brand-soft:rgba(29,209,161,.12);
  --r:12px;--sh:0 4px 12px rgba(0,0,0,.06);--sh2:0 6px 16px rgba(0,0,0,.08);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --head:'Poppins','Inter',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 36px;display:flex;justify-content:space-between;align-items:center;height:66px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.tb-left{display:flex;align-items:center;gap:18px}
.tb-logo{height:30px}.tb-sep{width:1.5px;height:30px;background:var(--border)}
.tb-badge{background:var(--green-light);color:var(--green-dark);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.04em}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-info{text-align:right}
.tb-time{font-size:11px;color:var(--muted);font-weight:500}
.tb-status{font-size:11px;margin-top:2px;font-weight:600}
.tb-status.ok{color:var(--green)}.tb-status.err{color:var(--red)}.tb-status.warn{color:var(--orange)}
.tb-taxa{text-align:right;line-height:1.05}
.tb-taxa-val{font-family:var(--head);font-variant-numeric:tabular-nums;font-size:23px;font-weight:700;color:var(--green)}
.tb-taxa-cap{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:1px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);border:none;color:#fff;padding:10px 22px;border-radius:999px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:.18s;box-shadow:0 1px 2px rgba(17,38,30,.1),0 4px 12px -2px rgba(29,209,161,.45)}
.btn:hover{background:var(--green-dark);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ctrl{background:#fff;border-bottom:1px solid var(--border);padding:0 36px;display:flex;justify-content:space-between;align-items:center;height:52px}
.tabs{display:flex;height:100%}
.tab{display:inline-flex;align-items:center;padding:0 22px;font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.07em;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;transition:.15s;text-transform:uppercase;height:100%}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.per-wrap{display:flex;align-items:center;gap:7px}
.per-lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.per-btn{padding:6px 15px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;transition:.14s}
.per-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.per-btn.apply{background:var(--green);color:#fff;border-color:var(--green)}
.custom-range{display:inline-flex;align-items:center;gap:7px}
.dt-inp{font-family:var(--font);font-size:11px;font-weight:600;color:var(--text2);padding:6px 10px;border:1px solid var(--border2);border-radius:20px;background:#fff;cursor:pointer}
.dt-inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--brand-soft)}
.inner{padding:26px 36px;flex:1 0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--sh);transition:.18s;cursor:default}
.kpi:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.kpi-top{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.kpi-val{font-size:34px;font-weight:900;line-height:1;margin-bottom:4px}
.kpi-sub{font-size:10px;color:var(--muted);font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.ctit{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--text2);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.brow{margin-bottom:13px}
.btop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bname{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:9px;font-weight:600}
.bval{font-size:20px;font-weight:900}
.btrack{background:var(--bg);height:5px;border-radius:3px;overflow:hidden}
.bfill{height:100%;border-radius:3px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.ava{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex-shrink:0}
.hrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.hmeta{flex:1}
.htop{display:flex;justify-content:space-between;margin-bottom:5px}
.hname{font-size:12px;color:var(--text2);font-weight:600}
.hpct{font-size:12px;font-weight:800}
.htrack{background:var(--bg);height:6px;border-radius:4px;overflow:hidden}
.hfill{height:100%;border-radius:4px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.hsub{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500}
.chart{padding-top:2px}
.chart-plot{position:relative;height:190px;display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--border2);margin-top:26px}
.chart-meta{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--border2);pointer-events:none}
.chart-meta span{position:absolute;right:2px;top:-14px;font-size:9px;font-weight:700;color:var(--muted);background:#fff;padding:0 6px;letter-spacing:.03em}
.chart-col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.chart-bar{position:relative;width:100%;max-width:46px;border-radius:6px 6px 0 0;min-height:4px;transition:height 1s cubic-bezier(.4,0,.2,1)}
.chart-bar:hover{filter:brightness(.95)}
.chart-val{position:absolute;top:-19px;left:0;right:0;text-align:center;font-family:var(--head);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700}
.chart-xrow{display:flex;gap:12px;padding-top:11px}
.chart-xcell{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.chart-xname{font-size:10px;color:var(--text2);font-weight:600}
.empresa-health{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:8px;margin-top:14px;border:1.5px solid}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.gbtn{padding:7px 16px 7px 8px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:999px;transition:.14s;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)}
.ghdr{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#fff;border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh)}
.ginfo{display:flex;align-items:center;gap:14px}
.glg{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.gnom{font-size:16px;font-weight:800}
.gcar{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.gkpis{display:flex;gap:20px}
.gkpi{text-align:center}
.gkl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.gkv{font-size:24px;font-weight:900}
.filter-tabs{display:flex;gap:8px;margin-bottom:14px}
.ftab{padding:7px 16px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:20px;transition:.14s}
.ftab.active-red{background:#fef2f2;border-color:#fca5a5;color:var(--red)}
.ftab.active-orange{background:#fff7ed;border-color:#fed7aa;color:var(--orange)}
.ftab.active-green{background:#e8f8f2;border-color:#a8dfc8;color:var(--green-dark)}
.task-list{max-height:420px;overflow-y:auto}
.task-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.task-item:last-child{border-bottom:none}
.task-nome{font-size:11px;color:var(--text2);font-weight:500;line-height:1.5;margin-bottom:6px}
.task-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px}
.task-due{font-size:11px;font-weight:800;flex-shrink:0;margin-top:2px}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:24px;font-weight:500}
.mci-bar-wrap{position:relative;background:#eef1f0;height:22px;border-radius:999px;overflow:hidden;margin:2px 0 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.mci-bar-fill{height:100%;border-radius:999px;transition:width 1.2s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;min-width:36px}
.mci-bar-label{font-size:11px;font-weight:700;color:#fff}
.mci-status{font-family:var(--head);font-size:12px;font-weight:700;padding:6px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mci-card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:26px;box-shadow:var(--sh);margin-bottom:14px}
.mci-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),#4fd1ab 60%,transparent)}
.mci-title{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--green-dark);text-transform:uppercase;margin-bottom:8px}
.mci-meta{font-size:18px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:20px;max-width:780px}
.mci-nums{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mci-num{text-align:center;padding:12px 8px;background:#fff;border-right:1px solid var(--border)}
.mci-num:last-child{border-right:none}
.mci-nl{font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
.mci-nv{font-size:26px;font-weight:700;line-height:1}
.placar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.placar-card{position:relative;background:#fff;border:1px solid var(--border);border-left:3px solid var(--c,var(--border2));border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);transition:transform .15s ease,box-shadow .15s ease}
.placar-card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.placar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.placar-nome{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px}
.placar-status{font-size:17px;line-height:1}
.placar-rank{font-family:var(--head);font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.placar-pct{font-size:30px;font-weight:700;line-height:1;margin-bottom:8px}
.placar-track{height:4px;border-radius:999px;background:#eef1f0;overflow:hidden;margin-bottom:9px}
.placar-track>i{display:block;height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.placar-sub{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:9px}
.cadencia-info{font-size:10px;font-weight:700;padding:5px 11px;border-radius:999px;display:inline-block}
.md-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-bottom:14px}
.md-item{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-left:3px solid var(--c,var(--ok));border-radius:10px;background:#fcfdfd}
.md-item+.md-item{margin-top:10px}
.md-num{min-width:40px;height:28px;padding:0 6px;border-radius:8px;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:11px;font-weight:800;letter-spacing:.03em;flex-shrink:0}
.md-body{flex:1}
.md-label{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.md-tag{font-family:var(--head);font-size:9.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.md-desc{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.55}
.reu-step{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}
.reu-list .reu-step:first-child{padding-top:4px}
.reu-list .reu-step:last-child{border-bottom:none}
.reu-num{width:28px;height:28px;border-radius:999px;background:#f3efff;color:var(--purple);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;flex-shrink:0}
.reu-body{flex:1}
.reu-label{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reu-time{font-family:var(--head);font-size:9.5px;font-weight:700;letter-spacing:.02em;color:var(--purple);background:#f3efff;border-radius:999px;padding:2px 9px;text-transform:uppercase}
.reu-desc{font-size:11.5px;color:var(--muted);line-height:1.55}
.reu-regra{margin-top:16px;background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px 15px;font-size:12px;color:var(--text2);line-height:1.5}
.reu-regra strong{color:var(--red);font-weight:800;margin-right:4px}
.countdown{display:inline-flex;align-items:center;gap:8px;background:#fef2f2;border:1px solid #fca5a5;border-radius:999px;padding:8px 15px;font-size:12px;font-weight:700;color:var(--red)}
.footer{background:#fff;border-top:1px solid var(--border);padding:14px 36px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);font-weight:500;margin-top:4px}
.flogo{height:22px}.fright{display:flex;align-items:center;gap:16px}
.fbadge{display:inline-flex;align-items:center;gap:5px;background:var(--green-light);color:var(--green-dark);font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
/* ==== Camada Keep Ads · números em Poppins e acabamento ==== */
.kpi-val,.bval,.gkv,.mci-nv,.placar-pct,.mci-bar-label,.hpct,.kc-num{font-family:var(--head);font-variant-numeric:tabular-nums}
.gnom,.mci-meta{font-family:var(--head)}
.kpi-val,.bval,.gkv,.mci-nv,.placar-pct{font-weight:700}
.gnom,.mci-meta{font-weight:700}
.btn{font-family:var(--head);font-weight:600}
.tb-badge,.fbadge{font-family:var(--head)}
/* Tabela de tarefas · estilo da tabela de clientes do dash de orçamento */
.tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:auto;max-height:520px;box-shadow:var(--sh)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{position:sticky;top:0;z-index:1;text-align:left;font-family:var(--head);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;padding:12px 18px;background:#f4f5f6;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl thead th.num{text-align:right}
.tbl tbody td{padding:13px 18px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl-row{transition:background .14s}
.tbl tbody tr:hover td{background:#f4faf8}
.tbl-name{font-weight:600;color:var(--text);line-height:1.45}
.tbl-row:hover .tbl-name{color:var(--green-dark)}
.tbl-tags{white-space:nowrap}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-due{font-family:var(--head);font-weight:700;white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpi,.card,.mci-card,.placar-card,.md-card,.ghdr{animation:fadeUp .4s ease backwards}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}
.g3 .card:nth-child(2){animation-delay:.06s}.g3 .card:nth-child(3){animation-delay:.12s}
.placar-card:nth-child(2){animation-delay:.05s}.placar-card:nth-child(3){animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

@media(max-width:980px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .placar-grid{grid-template-columns:repeat(2,1fr)}
  .topbar,.ctrl,.inner{padding-left:20px;padding-right:20px}
  .footer{padding-left:20px;padding-right:20px}
}
@media(max-width:600px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .placar-grid{grid-template-columns:1fr}
  .topbar{flex-direction:column;height:auto;padding:14px 16px;gap:10px}
  .ctrl{flex-direction:column;height:auto;padding:10px 16px;gap:8px}
  .inner{padding:20px 16px}
  .gkpis{gap:12px}
  .ghdr{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <img src="https://keepads.com.br/logos/header-logo.webp" alt="Keepads" class="tb-logo"/>
    <div class="tb-sep"></div>
    <span class="tb-badge">Painel de Produtividade</span>
  </div>
  <div class="tb-right">
    <div class="tb-info">
      <div class="tb-time" id="hdr-time">—</div>
      <div class="tb-status" id="hdr-status"></div>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-taxa">
      <div class="tb-taxa-val" id="hdr-taxa">—</div>
      <div class="tb-taxa-cap">Taxa de execução</div>
    </div>
    <button class="btn" id="btn-ref" onclick="doRefresh()">
      <svg id="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      Atualizar Agora
    </button>
  </div>
</header>
<div class="ctrl">
  <div class="tabs">
    <button class="tab active" id="tab-geral" onclick="setTab('geral')">Resumo Geral</button>
    <button class="tab" id="tab-gestor" onclick="setTab('gestor')">Por Gestor</button>
    <button class="tab" id="tab-4dx" onclick="setTab('4dx')">🎯 4DX · MCI</button>
  </div>
  <div class="per-wrap">
    <span class="per-lbl">Período</span>
    <button class="per-btn active" id="per-semana" onclick="setPer('semana')">Esta Semana</button>
    <button class="per-btn" id="per-mes" onclick="setPer('mes')">Este Mês</button>
    <button class="per-btn" id="per-ano" onclick="setPer('ano')">Este Ano</button>
    <button class="per-btn" id="per-custom" onclick="setPer('custom')">Personalizado</button>
    <span class="custom-range" id="custom-range" style="display:none">
      <input type="date" id="dt-from" class="dt-inp"/>
      <span class="per-lbl" style="margin:0">até</span>
      <input type="date" id="dt-to" class="dt-inp"/>
      <button class="per-btn apply" onclick="applyCustom()">Aplicar</button>
    </span>
  </div>
</div>
<div class="inner"><div id="content"></div></div>
<footer class="footer">
  <img src="https://keepads.com.br/logos/header-logo.webp" alt="Keepads" class="flogo"/>
  <div class="fright">
    <span>Space · Atividades clientes</span>
    <span class="fbadge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      4DX · Produtividade
    </span>
    <span id="fdate"></span>
  </div>
</footer>
<script>
const GESTORES=[{name:"Marcos Coelho",ini:"MC"},{name:"Pedro Augusto",ini:"PA"},{name:"Tiago Ciribeli",ini:"TC"},{name:"Alexandre Pires",ini:"AD"},{name:"Ana Clara Rayol",ini:"AC"},{name:"Kelven Pimenta",ini:"KP"},{name:"Enzo Santos Paiva",ini:"ES"}];
const COR={"Marcos Coelho":"#ff3b30","Pedro Augusto":"#ff6d00","Tiago Ciribeli":"#c08a0e","Alexandre Pires":"#1dd1a1","Ana Clara Rayol":"#2b6cb0","Kelven Pimenta":"#6d48d6","Enzo Santos Paiva":"#0891b2"};
const CBG={"Marcos Coelho":"#fef2f2","Pedro Augusto":"#fff7ed","Tiago Ciribeli":"#fffbeb","Alexandre Pires":"#e8f8f2","Ana Clara Rayol":"#ebf8ff","Kelven Pimenta":"#f3efff","Enzo Santos Paiva":"#ecfeff"};
const TAG_CORES={"rotina":{bg:"#ebf8ff",c:"#2b6cb0"},"tarefa estratégica":{bg:"#f3efff",c:"#6d48d6"},"tarefa especifica":{bg:"#fff7ed",c:"#ff6d00"},"tarefa específica":{bg:"#fff7ed",c:"#ff6d00"},"onboarding":{bg:"#e8f8f2",c:"#1dd1a1"},"cliente":{bg:"#fff0f6",c:"#c0507a"}};
const PL={semana:"Esta Semana",mes:"Este Mês",ano:"Este Ano",custom:"Personalizado"};
const hC=h=>h>=60?"#1dd1a1":h>=35?"#ff6d00":"#ff3b30";

let DADOS={};
let tab="geral",per="semana",gest="Marcos Coelho",filtro="atrasado",busy=false;
let customFrom="",customTo="";
const fd=()=>new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
const ft=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

window.onload=()=>{
  document.getElementById("fdate").textContent=fd();
  document.getElementById("hdr-time").textContent="Última atualização: "+fd()+" "+ft();
  render();
};

function setTab(t){tab=t;["geral","gestor","4dx"].forEach(k=>document.getElementById("tab-"+k).classList.toggle("active",k===t));render();}
function setPer(p){
  ["semana","mes","ano","custom"].forEach(k=>document.getElementById("per-"+k).classList.toggle("active",k===p));
  document.getElementById("custom-range").style.display=p==="custom"?"inline-flex":"none";
  if(p==="custom"){ if(!customFrom||!customTo) return; }
  per=p;doRefresh();
}
function fmtBR(s){var p=s.split("-");return p[2]+"/"+p[1];}
function applyCustom(){
  var f=document.getElementById("dt-from").value, t=document.getElementById("dt-to").value;
  if(!f||!t){ setSt("Escolha as duas datas.","warn"); return; }
  if(f>t){ setSt("A data inicial é maior que a final.","warn"); return; }
  customFrom=f; customTo=t; per="custom";
  PL.custom=fmtBR(f)+" a "+fmtBR(t);
  doRefresh();
}
function setGest(n){gest=n;filtro="atrasado";render();}
function setFiltro(f){filtro=f;render();}
function taxaGeral(){
  var tA=0,tV=0,tF=0;
  GESTORES.forEach(function(g){var d=DADOS[g.name]||{};tA+=d.totalAtrasado||0;tV+=d.totalVenceHoje||0;tF+=d.totalFeito||0;});
  return tA+tV+tF>0?Math.round(tF/(tA+tV+tF)*100):0;
}
function updateHeaderTaxa(){
  var el=document.getElementById("hdr-taxa");if(!el)return;
  var temDados=GESTORES.some(function(g){return DADOS[g.name];});
  if(!temDados){el.textContent="—";el.style.color="var(--muted)";return;}
  var tx=taxaGeral();
  el.textContent=tx+"%";
  el.style.color=hC(tx);
}
function render(){updateHeaderTaxa();document.getElementById("content").innerHTML=tab==="geral"?rGeral():tab==="gestor"?rGest():r4dx();}

function tagHtml(tags){
  return (tags||[]).map(function(t){
    var tc=TAG_CORES[t.toLowerCase()]||{bg:"#f7fafc",c:"#718096"};
    return '<span class="tag" style="background:'+tc.bg+';color:'+tc.c+'">'+t+'</span>';
  }).join("");
}

function taskListHtml(tasks,cor,dueLbl){
  if(!tasks||tasks.length===0) return '<div class="card"><div class="empty">Nenhuma tarefa nesta categoria ✓</div></div>';
  var rows=tasks.map(function(t){
    return '<tr class="tbl-row"><td class="tbl-name">'+t.nome+'</td><td class="tbl-tags">'+tagHtml(t.tags)+'</td><td class="num tbl-due" style="color:'+cor+'">'+t.dueStr+'</td></tr>';
  }).join("");
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'
    +'<th>Tarefa</th><th>Tags</th><th class="num">'+(dueLbl||'Prazo')+'</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function rGeral(){
  var tA=0,tV=0,tF=0;
  GESTORES.forEach(function(g){
    var d=DADOS[g.name];
    if(!d)return;
    tA+=d.totalAtrasado||0;
    tV+=d.totalVenceHoje||0;
    tF+=d.totalFeito||0;
  });
  var tPend=tA+tV;
  var tx=tPend+tF>0?Math.round(tF/(tPend+tF)*100):0;
  var txC=hC(tx);
  var mA=Math.max(1,...GESTORES.map(function(g){return DADOS[g.name]?DADOS[g.name].totalAtrasado:0;}));
  var mV=Math.max(1,...GESTORES.map(function(g){return DADOS[g.name]?DADOS[g.name].totalVenceHoje:0;}));
  var mF=Math.max(1,...GESTORES.map(function(g){return DADOS[g.name]?DADOS[g.name].totalFeito:0;}));

  var kpis='<div class="kpi-grid">'
    +'<div class="kpi"><div class="kpi-top" style="background:#ff3b30"></div><div class="kpi-lbl">Em Atraso</div><div class="kpi-val" style="color:#ff3b30">'+tA+'</div><div class="kpi-sub">Tarefas vencidas</div></div>'
    +'<div class="kpi"><div class="kpi-top" style="background:#ff6d00"></div><div class="kpi-lbl">Vence Hoje</div><div class="kpi-val" style="color:#ff6d00">'+tV+'</div><div class="kpi-sub">Prazo até fim do dia</div></div>'
    +'<div class="kpi"><div class="kpi-top" style="background:#1dd1a1"></div><div class="kpi-lbl">Feitas · '+PL[per]+'</div><div class="kpi-val" style="color:#1dd1a1">'+tF+'</div><div class="kpi-sub">Tarefas concluídas</div></div>'
    +'<div class="kpi"><div class="kpi-top" style="background:'+txC+'"></div><div class="kpi-lbl">Taxa de Execução</div><div class="kpi-val" style="color:'+txC+'">'+tx+'%</div><div class="kpi-sub">Feitas / (Pendentes + Feitas)</div></div>'
    +'</div>';

  var bA=GESTORES.map(function(g){var v=(DADOS[g.name]||{}).totalAtrasado||0,pct=v/mA*100;return'<div class="brow"><div class="btop"><div class="bname"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span>'+g.name.split(" ")[0]+'</div><span class="bval" style="color:#ff3b30">'+v+'</span></div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:#ff3b30"></div></div></div>';}).join("");
  var bV=GESTORES.map(function(g){var v=(DADOS[g.name]||{}).totalVenceHoje||0,pct=v/mV*100;return'<div class="brow"><div class="btop"><div class="bname"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span>'+g.name.split(" ")[0]+'</div><span class="bval" style="color:#ff6d00">'+v+'</span></div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:#ff6d00"></div></div></div>';}).join("");
  var bF=GESTORES.map(function(g){var v=(DADOS[g.name]||{}).totalFeito||0,pct=v/mF*100;return'<div class="brow"><div class="btop"><div class="bname"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span>'+g.name.split(" ")[0]+'</div><span class="bval" style="color:#1dd1a1">'+v+'</span></div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:#1dd1a1"></div></div></div>';}).join("");

  var chartCols=GESTORES.map(function(g){
    var d=DADOS[g.name]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0};
    var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
    var h=tot>0?Math.round(d.totalFeito/tot*100):100;
    var hc=hC(h);
    return '<div class="chart-col"><div class="chart-bar" title="'+g.name.split(" ")[0]+': '+h+'%" style="height:'+h+'%;background:'+hc+'"><span class="chart-val" style="color:'+hc+'">'+h+'%</span></div></div>';
  }).join("");
  var chartX=GESTORES.map(function(g){
    return '<div class="chart-xcell"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span><span class="chart-xname">'+g.name.split(" ")[0]+'</span></div>';
  }).join("");

  var empBorder=tx>=60?"#a8dfc8":tx>=35?"#fed7aa":"#fca5a5";
  var empBg=tx>=60?"#e8f8f2":tx>=35?"#fff7ed":"#fef2f2";

  var saudeGeral='<div class="ghdr" style="margin-bottom:16px">'
    +'<div class="ginfo"><div class="glg" style="background:#e8f8f2;color:#15a883">'
    +'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-12 2 7h6"/></svg>'
    +'</div><div><div class="gnom">Saúde Geral da Empresa</div><div class="gcar">Keepads · '+PL[per]+'</div></div></div>'
    +'<div class="gkpis">'
    +'<div class="gkpi"><div class="gkl">Em Atraso</div><div class="gkv" style="color:#ff3b30">'+tA+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Vence Hoje</div><div class="gkv" style="color:#ff6d00">'+tV+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Feitas</div><div class="gkv" style="color:#1dd1a1">'+tF+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Saúde</div><div class="gkv" style="color:'+txC+'">'+tx+'%</div></div>'
    +'</div></div>';

  return saudeGeral
    +kpis
    +'<div class="g3">'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#ff3b30"></span>Em Atraso · por gestor</div>'+bA+'</div>'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#ff6d00"></span>Vence Hoje · por gestor</div>'+bV+'</div>'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#1dd1a1"></span>Feitas · '+PL[per]+'</div>'+bF+'</div>'
    +'</div>'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#6d48d6"></span>Saúde · por gestor</div>'
    +'<div class="chart"><div class="chart-plot"><div class="chart-meta" style="bottom:'+tx+'%"><span>Média '+tx+'%</span></div>'+chartCols+'</div><div class="chart-xrow">'+chartX+'</div></div>'
    +'</div>';
}

function rGest(){
  var g=GESTORES.find(function(x){return x.name===gest;});
  var cor=COR[gest],bg=CBG[gest];
  var d=DADOS[gest]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0,atrasado:[],venceHoje:[],feito:[]};
  var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
  var tx=tot>0?Math.round(d.totalFeito/tot*100):100;
  var txC=hC(tx);

  var gBtns=GESTORES.map(function(gx){
    var at=gx.name===gest;
    return'<button class="gbtn'+(at?" active":"")+'" onclick="setGest(\''+gx.name+'\')" style="'+(at?"background:"+CBG[gx.name]+";border-color:"+COR[gx.name]+";color:"+COR[gx.name]:"")+'">'
    +'<span class="ava" style="background:'+CBG[gx.name]+';color:'+COR[gx.name]+'">'+gx.ini+'</span>'+gx.name.split(" ")[0]+'</button>';
  }).join("");

  var fAtClass=filtro==="atrasado"?"active-red":"";
  var fVhClass=filtro==="venceHoje"?"active-orange":"";
  var fFtClass=filtro==="feito"?"active-green":"";

  var tarefas=d[filtro]||[];
  var taskCor=filtro==="atrasado"?"#ff3b30":filtro==="venceHoje"?"#ff6d00":"#1dd1a1";
  var dueLbl=filtro==="feito"?"Concluída":"Prazo";
  var taskHtml=taskListHtml(tarefas,taskCor,dueLbl);

  var empBorder=tx>=60?"#a8dfc8":tx>=35?"#fed7aa":"#fca5a5";
  var empBg=tx>=60?"#e8f8f2":tx>=35?"#fff7ed":"#fef2f2";
  var empLabel=tx>=60?"No ritmo ✓":tx>=35?"Atenção necessária":"Situação crítica";

  return '<div class="gbtns">'+gBtns+'</div>'
    +'<div class="ghdr">'
    +'<div class="ginfo"><div class="glg" style="background:'+bg+';color:'+cor+'">'+g.ini+'</div>'
    +'<div><div class="gnom">'+gest+'</div><div class="gcar">Gestor · Keepads · '+PL[per]+'</div></div></div>'
    +'<div class="gkpis">'
    +'<div class="gkpi"><div class="gkl">Em Atraso</div><div class="gkv" style="color:#ff3b30">'+d.totalAtrasado+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Vence Hoje</div><div class="gkv" style="color:#ff6d00">'+d.totalVenceHoje+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Feitas</div><div class="gkv" style="color:#1dd1a1">'+d.totalFeito+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Saúde</div><div class="gkv" style="color:'+txC+'">'+tx+'%</div></div>'
    +'</div></div>'
    +'<div class="filter-tabs">'
    +'<button class="ftab '+fAtClass+'" onclick="setFiltro(\'atrasado\')">🔴 Em Atraso ('+d.totalAtrasado+')</button>'
    +'<button class="ftab '+fVhClass+'" onclick="setFiltro(\'venceHoje\')">🟠 Vence Hoje ('+d.totalVenceHoje+')</button>'
    +'<button class="ftab '+fFtClass+'" onclick="setFiltro(\'feito\')">🟢 Feitas · '+PL[per]+' ('+d.totalFeito+')</button>'
    +'</div>'
    +taskHtml;
}

function r4dx(){
  var META_INICIO = 66;
  var META_FIM = 90;
  var META_DATA = new Date('2026-06-30');
  var hoje = new Date();
  var diasRestantes = Math.max(0, Math.ceil((META_DATA - hoje) / 86400000));
  var diasTotais = Math.ceil((META_DATA - new Date('2026-06-09')) / 86400000);
  var diasPassados = diasTotais - diasRestantes;

  // Calcula taxa atual geral
  var tA=0,tV=0,tF=0;
  GESTORES.forEach(function(g){
    var d=DADOS[g.name]||{};
    tA+=(d.totalAtrasado||0);
    tV+=(d.totalVenceHoje||0);
    tF+=(d.totalFeito||0);
  });
  var taxaAtual = tA+tV+tF>0 ? Math.round(tF/(tA+tV+tF)*100) : 0;
  var progresso = Math.min(100, taxaAtual);

  // Cadência esperada hoje
  var cadenciaHoje = META_INICIO + Math.round((META_FIM - META_INICIO) * (diasPassados / diasTotais));

  var barColor = taxaAtual >= META_FIM ? '#1dd1a1' : taxaAtual >= cadenciaHoje ? '#1dd1a1' : taxaAtual >= cadenciaHoje - 5 ? '#ff6d00' : '#ff3b30';

  // Ranking por saúde (define a posição de cada gestor)
  var rankMap={};
  GESTORES.map(function(g){
    var d=DADOS[g.name]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0};
    var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
    return {name:g.name, h:tot>0?Math.round(d.totalFeito/tot*100):100};
  }).sort(function(a,b){return b.h-a.h;}).forEach(function(x,i){rankMap[x.name]=i+1;});

  // Placar por gestor
  var placarHtml = GESTORES.map(function(g){
    var d=DADOS[g.name]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0};
    var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
    var h=tot>0?Math.round(d.totalFeito/tot*100):100;
    var ganhando = h >= cadenciaHoje;
    var cor = h >= 85 ? '#1dd1a1' : h >= 65 ? '#ff6d00' : '#ff3b30';
    var pos = rankMap[g.name];
    var rankStyle = pos===1?'background:#fdf6e3;color:#b8860b;border-color:#eedfa8'
      :pos===2?'background:#f2f4f6;color:#64748b;border-color:#dbe1e7'
      :pos===3?'background:#fbeee1;color:#b0692f;border-color:#eccdad'
      :'background:var(--bg);color:var(--text2);border-color:var(--border)';
    var cadLabel = ganhando ? 'Acima da cadência' : 'Abaixo da cadência';
    var cadBg = ganhando ? 'background:#e8f8f2;color:#15a883' : 'background:#fef2f2;color:#ff3b30';
    return '<div class="placar-card" style="--c:'+cor+'">'
      +'<div class="placar-top"><div class="placar-nome"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+GESTORES.find(function(x){return x.name===g.name;}).ini+'</span>'+g.name.split(" ")[0]+'</div><span class="placar-rank" style="'+rankStyle+'">'+pos+'º</span></div>'
      +'<div class="placar-pct" style="color:'+cor+'">'+h+'%</div>'
      +'<div class="placar-track"><i style="width:'+Math.min(100,h)+'%;background:'+cor+'"></i></div>'
      +'<div class="placar-sub">'+d.totalFeito+' feitas · '+(d.totalAtrasado+d.totalVenceHoje)+' pendentes</div>'
      +'<div class="cadencia-info" style="'+cadBg+'">'+cadLabel+' (meta: '+cadenciaHoje+'%)</div>'
      +'</div>';
  }).join('');

  var batida = taxaAtual >= META_FIM;
  var stStyle = batida ? 'background:#e8f8f2;color:#15a883;border:1px solid #a8dfc8'
                       : 'background:#fef2f2;color:#ff3b30;border:1px solid #fca5a5';
  var stLabel = batida ? '✓ META BATIDA' : 'META NÃO BATIDA';

  return '<div class="mci-card">'
    +'<div class="mci-title">🎯 Meta Crucialmente Importante · 4DX · '+PL[per]+'</div>'
    +'<div class="mci-meta">"Manter a taxa de execução de tarefas dos gestores em 90% ou mais."</div>'
    +'<div class="mci-nums">'
    +'<div class="mci-num"><div class="mci-nl">Taxa Atual</div><div class="mci-nv" style="color:'+barColor+'">'+taxaAtual+'%</div></div>'
    +'<div class="mci-num"><div class="mci-nl">Meta</div><div class="mci-nv" style="color:#1dd1a1">90%</div></div>'
    +'<div class="mci-num"><div class="mci-nl">Tarefas Feitas</div><div class="mci-nv" style="color:var(--text)">'+tF+'</div></div>'
    +'<div class="mci-num"><div class="mci-nl">Pendentes</div><div class="mci-nv" style="color:#ff6d00">'+(tA+tV)+'</div></div>'
    +'</div>'
    +'<div class="mci-bar-wrap"><div class="mci-bar-fill" style="width:'+progresso+'%;background:'+barColor+'"><span class="mci-bar-label">'+taxaAtual+'%</span></div></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap">'
    +'<span style="font-size:11px;color:var(--muted);font-weight:500">Meta do período: 90% · atual '+taxaAtual+'%</span>'
    +'<span class="mci-status" style="'+stStyle+'">'+stLabel+'</span>'
    +'</div></div>'
    +'<div class="ctit" style="margin-bottom:10px"><span class="cdot" style="background:#6d48d6"></span>PLACAR · Situação de cada gestor</div>'
    +'<div class="placar-grid">'+placarHtml+'</div>'
    +'<div class="md-card"><div class="ctit"><span class="cdot" style="background:#ff6d00"></span>Medidas de Direção · Lead Measures semanais</div>'
    +'<div class="md-item" style="--c:var(--green)"><div class="md-num" style="background:var(--green-light);color:var(--green-dark)">MD1</div><div class="md-body"><div class="md-label">Zerar tarefas em atraso antes de sexta-feira <span class="md-tag" style="background:var(--green-light);color:var(--green-dark)">Meta: 0 na sexta</span></div><div class="md-desc">Cada gestor resolve todas as tarefas em atraso e vencendo hoje até o fim de cada semana.</div></div></div>'
    +'<div class="md-item" style="--c:var(--purple)"><div class="md-num" style="background:#f3efff;color:var(--purple)">MD2</div><div class="md-body"><div class="md-label">Reunião de MCI toda segunda-feira <span class="md-tag" style="background:#f3efff;color:var(--purple)">Segunda · 20 min</span></div><div class="md-desc">Cada gestor apresenta: o que me comprometi → o que entreguei → o que farei essa semana. Proibido entrar no operacional.</div></div></div>'
    +'</div>'
    +'<div class="md-card">'
    +'<div class="ctit"><span class="cdot" style="background:#6d48d6"></span>Estrutura da Reunião de MCI · toda segunda, 20 min</div>'
    +'<div class="reu-list">'
    +'<div class="reu-step"><span class="reu-num">1</span><div class="reu-body"><div class="reu-label">Abertura <span class="reu-time">2 min</span></div><div class="reu-desc">"Nossa MCI é elevar a execução de 66% para 90% até 30/06."</div></div></div>'
    +'<div class="reu-step"><span class="reu-num">2</span><div class="reu-body"><div class="reu-label">Rodada dos gestores <span class="reu-time">2 min cada</span></div><div class="reu-desc">Compromisso passado → entrega → placar → próximo compromisso.</div></div></div>'
    +'<div class="reu-step"><span class="reu-num">3</span><div class="reu-body"><div class="reu-label">Remoção de obstáculos</div><div class="reu-desc">O líder remove os bloqueios identificados. Não pune, destrava.</div></div></div>'
    +'<div class="reu-step"><span class="reu-num">4</span><div class="reu-body"><div class="reu-label">Celebração</div><div class="reu-desc">Quem bateu a cadência essa semana?</div></div></div>'
    +'</div>'
    +'<div class="reu-regra"><strong>⚠️ Regra:</strong> redemoinho é proibido nessa reunião. Tem reunião separada para isso.</div>'
    +'</div>';
}

async function doRefresh(){
  if(busy)return;busy=true;
  var btn=document.getElementById("btn-ref");btn.disabled=true;btn.classList.add("spin");
  setSt("Buscando dados no ClickUp…","warn");
  try{
    var r=await fetch("/api/refresh",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({periodo:per,from:customFrom,to:customTo})
    });
    if(!r.ok){var e=await r.json();throw new Error(e.error||"Erro no servidor");}
    var parsed=await r.json();
    if(parsed.gestores) DADOS=parsed.gestores;
    document.getElementById("hdr-time").textContent="Última atualização: "+fd()+" "+ft();
    setSt("Dados atualizados com sucesso ✓","ok");
    render();
  }catch(e){setSt("Erro: "+e.message,"err");}
  finally{busy=false;btn.disabled=false;btn.classList.remove("spin");}
}

function setSt(m,t){var el=document.getElementById("hdr-status");el.textContent=m;el.className="tb-status "+t;}

</script>
