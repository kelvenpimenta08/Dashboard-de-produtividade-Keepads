<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Keepads · Painel de Produtividade</title>
<link rel="icon" href="https://keepads.com.br/logos/header-logo.webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1DB886;--green-light:#e8f8f2;--green-mid:#a8dfc8;--green-dark:#0f9b6e;
  --bg:#f0f5f2;--surface:#fff;--border:#e0ebe5;--border2:#cdddd6;
  --text:#0d1a14;--text2:#3d5248;--muted:#7a9589;
  --red:#e53e3e;--orange:#dd6b20;--yellow:#c08a0e;--purple:#6d48d6;--blue:#2b6cb0;
  --r:10px;--sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 14px rgba(0,0,0,.09);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.topbar{background:#fff;border-bottom:1.5px solid var(--border);padding:0 36px;display:flex;justify-content:space-between;align-items:center;height:66px;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.tb-left{display:flex;align-items:center;gap:18px}
.tb-logo{height:30px}.tb-sep{width:1.5px;height:30px;background:var(--border)}
.tb-badge{background:var(--green-light);color:var(--green-dark);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.04em}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-info{text-align:right}
.tb-time{font-size:11px;color:var(--muted);font-weight:500}
.tb-status{font-size:11px;margin-top:2px;font-weight:600}
.tb-status.ok{color:var(--green)}.tb-status.err{color:var(--red)}.tb-status.warn{color:var(--orange)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);border:none;color:#fff;padding:10px 22px;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:.18s;box-shadow:0 2px 10px rgba(29,184,134,.3)}
.btn:hover{background:var(--green-dark);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ctrl{background:#fff;border-bottom:1.5px solid var(--border);padding:0 36px;display:flex;justify-content:space-between;align-items:center;height:52px}
.tabs{display:flex;height:100%}
.tab{display:inline-flex;align-items:center;padding:0 22px;font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.07em;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;transition:.15s;text-transform:uppercase;height:100%}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.per-wrap{display:flex;align-items:center;gap:7px}
.per-lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.per-btn{padding:6px 15px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;transition:.14s}
.per-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.inner{padding:26px 36px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden;box-shadow:var(--sh);transition:.18s;cursor:default}
.kpi:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.kpi-top{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.kpi-val{font-size:34px;font-weight:900;line-height:1;margin-bottom:4px}
.kpi-sub{font-size:10px;color:var(--muted);font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.ctit{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--text2);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.brow{margin-bottom:13px}
.btop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bname{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:9px;font-weight:600}
.bval{font-size:20px;font-weight:900}
.btrack{background:var(--bg);height:5px;border-radius:3px;overflow:hidden}
.bfill{height:100%;border-radius:3px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.ava{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex-shrink:0}
.hrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.hmeta{flex:1}
.htop{display:flex;justify-content:space-between;margin-bottom:5px}
.hname{font-size:12px;color:var(--text2);font-weight:600}
.hpct{font-size:12px;font-weight:800}
.htrack{background:var(--bg);height:6px;border-radius:4px;overflow:hidden}
.hfill{height:100%;border-radius:4px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.hsub{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500}
.empresa-health{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:8px;margin-top:14px;border:1.5px solid}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.gbtn{padding:8px 16px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--muted);border-radius:8px;transition:.14s;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)}
.ghdr{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--sh)}
.ginfo{display:flex;align-items:center;gap:14px}
.glg{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.gnom{font-size:16px;font-weight:800}
.gcar{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
.gkpis{display:flex;gap:20px}
.gkpi{text-align:center}
.gkl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.gkv{font-size:24px;font-weight:900}
.filter-tabs{display:flex;gap:8px;margin-bottom:14px}
.ftab{padding:7px 16px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--muted);border-radius:20px;transition:.14s}
.ftab.active-red{background:#fef2f2;border-color:#fca5a5;color:var(--red)}
.ftab.active-orange{background:#fff7ed;border-color:#fed7aa;color:var(--orange)}
.ftab.active-green{background:#e8f8f2;border-color:#a8dfc8;color:var(--green-dark)}
.task-list{max-height:420px;overflow-y:auto}
.task-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1.5px solid var(--border);gap:10px}
.task-item:last-child{border-bottom:none}
.task-nome{font-size:11px;color:var(--text2);font-weight:500;line-height:1.5;margin-bottom:6px}
.task-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px}
.task-due{font-size:11px;font-weight:800;flex-shrink:0;margin-top:2px}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:24px;font-weight:500}
.mci-bar-wrap{background:#f0f5f2;height:20px;border-radius:10px;overflow:hidden;margin:12px 0}
.mci-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#1DB886,#0f9b6e);transition:width 1.2s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.mci-bar-label{font-size:10px;font-weight:800;color:#fff}
.mci-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:14px}
.mci-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.mci-meta{font-size:18px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:16px}
.mci-nums{display:flex;gap:28px;margin-bottom:16px}
.mci-num{text-align:center}
.mci-nl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.mci-nv{font-size:28px;font-weight:900}
.placar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.placar-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.placar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.placar-nome{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px}
.placar-status{font-size:18px}
.placar-pct{font-size:28px;font-weight:900;margin-bottom:4px}
.placar-sub{font-size:10px;color:var(--muted);font-weight:500}
.cadencia-info{font-size:10px;font-weight:700;margin-top:8px;padding:5px 8px;border-radius:6px;display:inline-block}
.md-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.md-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1.5px solid var(--border)}
.md-item:last-child{border-bottom:none}
.md-num{width:28px;height:28px;border-radius:8px;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.md-body{flex:1}
.md-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px}
.md-desc{font-size:11px;color:var(--muted);font-weight:500}
.countdown{display:inline-flex;align-items:center;gap:8px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:800;color:var(--red)}
.footer{background:#fff;border-top:1.5px solid var(--border);padding:14px 36px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);font-weight:500;margin-top:4px}
.flogo{height:22px}.fright{display:flex;align-items:center;gap:16px}
.fbadge{display:inline-flex;align-items:center;gap:5px;background:var(--green-light);color:var(--green-dark);font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
@media(max-width:980px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.topbar,.ctrl,.inner,.mci-bar-wrap{background:#f0f5f2;height:20px;border-radius:10px;overflow:hidden;margin:12px 0}
.mci-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#1DB886,#0f9b6e);transition:width 1.2s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.mci-bar-label{font-size:10px;font-weight:800;color:#fff}
.mci-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--sh);margin-bottom:14px}
.mci-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.mci-meta{font-size:18px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:16px}
.mci-nums{display:flex;gap:28px;margin-bottom:16px}
.mci-num{text-align:center}
.mci-nl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.mci-nv{font-size:28px;font-weight:900}
.placar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.placar-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.placar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.placar-nome{font-size:12px;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:8px}
.placar-status{font-size:18px}
.placar-pct{font-size:28px;font-weight:900;margin-bottom:4px}
.placar-sub{font-size:10px;color:var(--muted);font-weight:500}
.cadencia-info{font-size:10px;font-weight:700;margin-top:8px;padding:5px 8px;border-radius:6px;display:inline-block}
.md-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.md-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1.5px solid var(--border)}
.md-item:last-child{border-bottom:none}
.md-num{width:28px;height:28px;border-radius:8px;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.md-body{flex:1}
.md-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px}
.md-desc{font-size:11px;color:var(--muted);font-weight:500}
.countdown{display:inline-flex;align-items:center;gap:8px;background:#fef2f2;border:1.5px solid #fca5a5;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:800;color:var(--red)}
.footer{padding-left:16px;padding-right:16px}}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr 1fr}.topbar{flex-direction:column;height:auto;padding:14px 16px;gap:10px}.ctrl{flex-direction:column;height:auto;padding:10px 16px;gap:8px}.gkpis{gap:12px}.ghdr{flex-direction:column;align-items:flex-start;gap:12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-left">
    <img src="https://keepads.com.br/logos/header-logo.webp" alt="Keepads" class="tb-logo"/>
    <div class="tb-sep"></div>
    <span class="tb-badge">Painel de Produtividade</span>
  </div>
  <div class="tb-right">
    <div class="tb-info">
      <div class="tb-time" id="hdr-time">—</div>
      <div class="tb-status" id="hdr-status"></div>
    </div>
    <button class="btn" id="btn-ref" onclick="doRefresh()">
      <svg id="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
      Atualizar Agora
    </button>
  </div>
</header>
<div class="ctrl">
  <div class="tabs">
    <button class="tab active" id="tab-geral" onclick="setTab('geral')">Resumo Geral</button>
    <button class="tab" id="tab-gestor" onclick="setTab('gestor')">Por Gestor</button>
    <button class="tab" id="tab-4dx" onclick="setTab('4dx')">🎯 4DX · MCI</button>
  </div>
  <div class="per-wrap">
    <span class="per-lbl">Período</span>
    <button class="per-btn active" id="per-semana" onclick="setPer('semana')">Esta Semana</button>
    <button class="per-btn" id="per-mes" onclick="setPer('mes')">Este Mês</button>
    <button class="per-btn" id="per-ano" onclick="setPer('ano')">Este Ano</button>
  </div>
</div>
<div class="inner"><div id="content"></div></div>
<footer class="footer">
  <img src="https://keepads.com.br/logos/header-logo.webp" alt="Keepads" class="flogo"/>
  <div class="fright">
    <span>Space · Atividades clientes</span>
    <span class="fbadge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      4DX · Produtividade
    </span>
    <span id="fdate"></span>
  </div>
</footer>
<script>
const GESTORES=[{name:"Marcos Coelho",ini:"MC"},{name:"Pedro Augusto",ini:"PA"},{name:"Tiago Ciribeli",ini:"TC"},{name:"Alexandre Pires",ini:"AD"},{name:"Ana Clara Rayol",ini:"AC"},{name:"Kelven Pimenta",ini:"KP"}];
const COR={"Marcos Coelho":"#e53e3e","Pedro Augusto":"#dd6b20","Tiago Ciribeli":"#c08a0e","Alexandre Pires":"#1DB886","Ana Clara Rayol":"#2b6cb0","Kelven Pimenta":"#6d48d6"};
const CBG={"Marcos Coelho":"#fef2f2","Pedro Augusto":"#fff7ed","Tiago Ciribeli":"#fffbeb","Alexandre Pires":"#e8f8f2","Ana Clara Rayol":"#ebf8ff","Kelven Pimenta":"#f3efff"};
const TAG_CORES={"rotina":{bg:"#ebf8ff",c:"#2b6cb0"},"tarefa estratégica":{bg:"#f3efff",c:"#6d48d6"},"tarefa especifica":{bg:"#fff7ed",c:"#dd6b20"},"tarefa específica":{bg:"#fff7ed",c:"#dd6b20"},"onboarding":{bg:"#e8f8f2",c:"#1DB886"},"cliente":{bg:"#fff0f6",c:"#c0507a"}};
const PL={semana:"Esta Semana",mes:"Este Mês",ano:"Este Ano"};
const hC=h=>h>=60?"#1DB886":h>=35?"#dd6b20":"#e53e3e";

let DADOS={};
let tab="geral",per="semana",gest="Marcos Coelho",filtro="atrasado",busy=false;
const fd=()=>new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
const ft=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

window.onload=()=>{
  document.getElementById("fdate").textContent=fd();
  document.getElementById("hdr-time").textContent="Última atualização: "+fd()+" "+ft();
  render();
};

function setTab(t){tab=t;["geral","gestor","4dx"].forEach(k=>document.getElementById("tab-"+k).classList.toggle("active",k===t));render();}
function setPer(p){per=p;["semana","mes","ano"].forEach(k=>document.getElementById("per-"+k).classList.toggle("active",k===p));doRefresh();}
function setGest(n){gest=n;filtro="atrasado";render();}
function setFiltro(f){filtro=f;render();}
function render(){document.getElementById("content").innerHTML=tab==="geral"?rGeral():tab==="gestor"?rGest():r4dx();}

function tagHtml(tags){
  return (tags||[]).map(function(t){
    var tc=TAG_CORES[t.toLowerCase()]||{bg:"#f7fafc",c:"#718096"};
    return '<span class="tag" style="background:'+tc.bg+';color:'+tc.c+'">'+t+'</span>';
  }).join("");
}

function taskListHtml(tasks,cor){
  if(!tasks||tasks.length===0) return '<div class="empty">Nenhuma tarefa nesta categoria ✓</div>';
  return tasks.map(function(t){
    return '<div class="task-item"><div style="flex:1;min-width:0"><div class="task-nome">'+t.nome+'</div><div class="task-tags">'+tagHtml(t.tags)+'</div></div><div class="task-due" style="color:'+cor+'">'+t.dueStr+'</div></div>';
  }).join("");
}

function rGeral(){
  var tA=0,tV=0,tF=0;
  GESTORES.forEach(function(g){
    var d=DADOS[g.name];
    if(!d)return;
    tA+=d.totalAtrasado||0;
    tV+=d.totalVenceHoje||0;
    tF+=d.totalFeito||0;
  });
  var tPend=tA+tV;
  var tx=tPend+tF>0?Math.round(tF/(tPend+tF)*100):0;
  var txC=hC(tx);
  var mA=Math.max(1,...GESTORES.map(function(g){return DADOS[g.name]?DADOS[g.name].totalAtrasado:0;}));
  var mV=Math.max(1,...GESTORES.map(function(g){return DADOS[g.name]?DADOS[g.name].totalVenceHoje:0;}));
  var mF=Math.max(1,...GESTORES.map(function(g){return DADOS[g.name]?DADOS[g.name].totalFeito:0;}));

  var kpis='<div class="kpi-grid">'
    +'<div class="kpi"><div class="kpi-top" style="background:#e53e3e"></div><div class="kpi-lbl">Em Atraso</div><div class="kpi-val" style="color:#e53e3e">'+tA+'</div><div class="kpi-sub">Tarefas vencidas</div></div>'
    +'<div class="kpi"><div class="kpi-top" style="background:#dd6b20"></div><div class="kpi-lbl">Vence Hoje</div><div class="kpi-val" style="color:#dd6b20">'+tV+'</div><div class="kpi-sub">Prazo até fim do dia</div></div>'
    +'<div class="kpi"><div class="kpi-top" style="background:#1DB886"></div><div class="kpi-lbl">Feitas · '+PL[per]+'</div><div class="kpi-val" style="color:#1DB886">'+tF+'</div><div class="kpi-sub">Tarefas concluídas</div></div>'
    +'<div class="kpi"><div class="kpi-top" style="background:'+txC+'"></div><div class="kpi-lbl">Taxa de Execução</div><div class="kpi-val" style="color:'+txC+'">'+tx+'%</div><div class="kpi-sub">Feitas / (Pendentes + Feitas)</div></div>'
    +'</div>';

  var bA=GESTORES.map(function(g){var v=(DADOS[g.name]||{}).totalAtrasado||0,pct=v/mA*100;return'<div class="brow"><div class="btop"><div class="bname"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span>'+g.name.split(" ")[0]+'</div><span class="bval" style="color:#e53e3e">'+v+'</span></div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:#e53e3e"></div></div></div>';}).join("");
  var bV=GESTORES.map(function(g){var v=(DADOS[g.name]||{}).totalVenceHoje||0,pct=v/mV*100;return'<div class="brow"><div class="btop"><div class="bname"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span>'+g.name.split(" ")[0]+'</div><span class="bval" style="color:#dd6b20">'+v+'</span></div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:#dd6b20"></div></div></div>';}).join("");
  var bF=GESTORES.map(function(g){var v=(DADOS[g.name]||{}).totalFeito||0,pct=v/mF*100;return'<div class="brow"><div class="btop"><div class="bname"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span>'+g.name.split(" ")[0]+'</div><span class="bval" style="color:#1DB886">'+v+'</span></div><div class="btrack"><div class="bfill" style="width:'+pct+'%;background:#1DB886"></div></div></div>';}).join("");

  var hlHtml=GESTORES.map(function(g){
    var d=DADOS[g.name]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0};
    var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
    var h=tot>0?Math.round(d.totalFeito/tot*100):100;
    var hc=hC(h);
    return'<div class="hrow"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+g.ini+'</span><div class="hmeta"><div class="htop"><span class="hname">'+g.name.split(" ")[0]+'</span><span class="hpct" style="color:'+hc+'">'+h+'%</span></div><div class="htrack"><div class="hfill" style="width:'+h+'%;background:'+hc+'"></div></div><div class="hsub">'+d.totalFeito+' feitas · '+d.totalAtrasado+' atrasadas · '+d.totalVenceHoje+' vencem hoje</div></div></div>';
  }).join("");

  var empBorder=tx>=60?"#a8dfc8":tx>=35?"#fed7aa":"#fca5a5";
  var empBg=tx>=60?"#e8f8f2":tx>=35?"#fff7ed":"#fef2f2";

  return kpis
    +'<div class="g3">'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#e53e3e"></span>Em Atraso — por gestor</div>'+bA+'</div>'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#dd6b20"></span>Vence Hoje — por gestor</div>'+bV+'</div>'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#1DB886"></span>Feitas · '+PL[per]+'</div>'+bF+'</div>'
    +'</div>'
    +'<div class="card"><div class="ctit"><span class="cdot" style="background:#6d48d6"></span>Health Score — saúde por gestor</div>'
    +hlHtml
    +'<div class="empresa-health" style="border-color:'+empBorder+';background:'+empBg+'">'
    +'<div><div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:'+txC+'">Saúde Geral da Empresa</div>'
    +'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+tF+' feitas · '+tA+' atrasadas · '+tV+' vencem hoje</div></div>'
    +'<div style="font-size:28px;font-weight:900;color:'+txC+'">'+tx+'%</div>'
    +'</div></div>';
}

function rGest(){
  var g=GESTORES.find(function(x){return x.name===gest;});
  var cor=COR[gest],bg=CBG[gest];
  var d=DADOS[gest]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0,atrasado:[],venceHoje:[],feito:[]};
  var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
  var tx=tot>0?Math.round(d.totalFeito/tot*100):100;
  var txC=hC(tx);

  var gBtns=GESTORES.map(function(gx){
    var at=gx.name===gest;
    return'<button class="gbtn'+(at?" active":"")+'" onclick="setGest(\''+gx.name+'\')" style="'+(at?"background:"+CBG[gx.name]+";border-color:"+COR[gx.name]+";color:"+COR[gx.name]:"")+'">'
    +'<span class="ava" style="background:'+CBG[gx.name]+';color:'+COR[gx.name]+'">'+gx.ini+'</span>'+gx.name.split(" ")[0]+'</button>';
  }).join("");

  var fAtClass=filtro==="atrasado"?"active-red":"";
  var fVhClass=filtro==="venceHoje"?"active-orange":"";
  var fFtClass=filtro==="feito"?"active-green":"";

  var tarefas=d[filtro]||[];
  var taskCor=filtro==="atrasado"?"#e53e3e":filtro==="venceHoje"?"#dd6b20":"#1DB886";
  var taskHtml=taskListHtml(tarefas,taskCor);

  var empBorder=tx>=60?"#a8dfc8":tx>=35?"#fed7aa":"#fca5a5";
  var empBg=tx>=60?"#e8f8f2":tx>=35?"#fff7ed":"#fef2f2";
  var empLabel=tx>=60?"No ritmo ✓":tx>=35?"Atenção necessária":"Situação crítica";

  return '<div class="gbtns">'+gBtns+'</div>'
    +'<div class="ghdr">'
    +'<div class="ginfo"><div class="glg" style="background:'+bg+';color:'+cor+'">'+g.ini+'</div>'
    +'<div><div class="gnom">'+gest+'</div><div class="gcar">Gestor · Keepads · '+PL[per]+'</div></div></div>'
    +'<div class="gkpis">'
    +'<div class="gkpi"><div class="gkl">Em Atraso</div><div class="gkv" style="color:#e53e3e">'+d.totalAtrasado+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Vence Hoje</div><div class="gkv" style="color:#dd6b20">'+d.totalVenceHoje+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Feitas</div><div class="gkv" style="color:#1DB886">'+d.totalFeito+'</div></div>'
    +'<div class="gkpi"><div class="gkl">Health</div><div class="gkv" style="color:'+txC+'">'+tx+'%</div></div>'
    +'</div></div>'
    +'<div class="empresa-health" style="border-color:'+empBorder+';background:'+empBg+';margin-bottom:14px">'
    +'<div><div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:'+txC+'">'+empLabel+'</div>'
    +'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+d.totalFeito+' feitas · '+d.totalAtrasado+' atrasadas · '+d.totalVenceHoje+' vencem hoje</div></div>'
    +'<div style="font-size:24px;font-weight:900;color:'+txC+'">'+tx+'%</div></div>'
    +'<div class="filter-tabs">'
    +'<button class="ftab '+fAtClass+'" onclick="setFiltro(\'atrasado\')">🔴 Em Atraso ('+d.totalAtrasado+')</button>'
    +'<button class="ftab '+fVhClass+'" onclick="setFiltro(\'venceHoje\')">🟠 Vence Hoje ('+d.totalVenceHoje+')</button>'
    +'<button class="ftab '+fFtClass+'" onclick="setFiltro(\'feito\')">🟢 Feitas · '+PL[per]+' ('+d.totalFeito+')</button>'
    +'</div>'
    +'<div class="card"><div class="task-list">'+taskHtml+'</div></div>';
}

function r4dx(){
  var META_INICIO = 66;
  var META_FIM = 90;
  var META_DATA = new Date('2026-06-30');
  var hoje = new Date();
  var diasRestantes = Math.max(0, Math.ceil((META_DATA - hoje) / 86400000));
  var diasTotais = Math.ceil((META_DATA - new Date('2026-06-09')) / 86400000);
  var diasPassados = diasTotais - diasRestantes;

  // Calcula taxa atual geral
  var tA=0,tV=0,tF=0;
  GESTORES.forEach(function(g){
    var d=DADOS[g.name]||{};
    tA+=(d.totalAtrasado||0);
    tV+=(d.totalVenceHoje||0);
    tF+=(d.totalFeito||0);
  });
  var taxaAtual = tA+tV+tF>0 ? Math.round(tF/(tA+tV+tF)*100) : 0;
  var progresso = Math.min(100, Math.round((taxaAtual - META_INICIO) / (META_FIM - META_INICIO) * 100));
  if (progresso < 0) progresso = 0;

  // Cadência esperada hoje
  var cadenciaHoje = META_INICIO + Math.round((META_FIM - META_INICIO) * (diasPassados / diasTotais));

  var barColor = taxaAtual >= META_FIM ? '#1DB886' : taxaAtual >= cadenciaHoje ? '#1DB886' : taxaAtual >= cadenciaHoje - 5 ? '#dd6b20' : '#e53e3e';

  // Placar por gestor
  var placarHtml = GESTORES.map(function(g){
    var d=DADOS[g.name]||{totalAtrasado:0,totalVenceHoje:0,totalFeito:0};
    var tot=d.totalAtrasado+d.totalVenceHoje+d.totalFeito;
    var h=tot>0?Math.round(d.totalFeito/tot*100):100;
    var ganhando = h >= cadenciaHoje;
    var cor = h >= 85 ? '#1DB886' : h >= 65 ? '#dd6b20' : '#e53e3e';
    var status = h >= META_FIM ? '🏆' : ganhando ? '🟢' : '🔴';
    var cadLabel = ganhando ? 'Acima da cadência' : 'Abaixo da cadência';
    var cadBg = ganhando ? 'background:#e8f8f2;color:#0f9b6e' : 'background:#fef2f2;color:#e53e3e';
    return '<div class="placar-card">'
      +'<div class="placar-top"><div class="placar-nome"><span class="ava" style="background:'+CBG[g.name]+';color:'+COR[g.name]+'">'+GESTORES.find(function(x){return x.name===g.name;}).ini+'</span>'+g.name.split(" ")[0]+'</div><span class="placar-status">'+status+'</span></div>'
      +'<div class="placar-pct" style="color:'+cor+'">'+h+'%</div>'
      +'<div class="placar-sub">'+d.totalFeito+' feitas · '+(d.totalAtrasado+d.totalVenceHoje)+' pendentes</div>'
      +'<div class="cadencia-info" style="'+cadBg+'">'+cadLabel+' (meta: '+cadenciaHoje+'%)</div>'
      +'</div>';
  }).join('');

  return '<div class="mci-card">'
    +'<div class="mci-title">🎯 Meta Crucialmente Importante — 4DX</div>'
    +'<div class="mci-meta">"Elevar a taxa de execução de tarefas dos gestores de 66% para 90% até 30/06/2026"</div>'
    +'<div class="mci-nums">'
    +'<div class="mci-num"><div class="mci-nl">Início</div><div class="mci-nv" style="color:var(--muted)">66%</div></div>'
    +'<div class="mci-num"><div class="mci-nl">Atual</div><div class="mci-nv" style="color:'+barColor+'">'+taxaAtual+'%</div></div>'
    +'<div class="mci-num"><div class="mci-nl">Meta</div><div class="mci-nv" style="color:#1DB886">90%</div></div>'
    +'<div class="mci-num"><div class="mci-nl">Cadência Hoje</div><div class="mci-nv" style="color:#dd6b20">'+cadenciaHoje+'%</div></div>'
    +'</div>'
    +'<div class="mci-bar-wrap"><div class="mci-bar-fill" style="width:'+progresso+'%;background:'+barColor+'"><span class="mci-bar-label">'+taxaAtual+'%</span></div></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">'
    +'<span style="font-size:11px;color:var(--muted);font-weight:500">Progresso: '+progresso+'% do caminho percorrido</span>'
    +'<span class="countdown">⏳ '+diasRestantes+' dias restantes</span>'
    +'</div></div>'
    +'<div class="ctit" style="margin-bottom:10px"><span class="cdot" style="background:#6d48d6"></span>PLACAR — Situação de cada gestor</div>'
    +'<div class="placar-grid">'+placarHtml+'</div>'
    +'<div class="md-card"><div class="ctit"><span class="cdot" style="background:#dd6b20"></span>Medidas de Direção — Lead Measures semanais</div>'
    +'<div class="md-item"><div class="md-num">MD1</div><div class="md-body"><div class="md-label">Zerar tarefas em atraso antes de sexta-feira</div><div class="md-desc">Cada gestor deve resolver todas as tarefas em atraso e vencendo hoje até o final de cada semana. Meta: 0 tarefas em atraso na sexta.</div></div></div>'
    +'<div class="md-item"><div class="md-num">MD2</div><div class="md-body"><div class="md-label">Reunião de MCI toda segunda-feira (20 min)</div><div class="md-desc">Cada gestor apresenta: o que me comprometi → o que entreguei → o que farei essa semana. Proibido entrar em operacional.</div></div></div>'
    +'</div>'
    +'<div class="card" style="background:#fffbeb;border-color:#fed7aa">'
    +'<div class="ctit"><span class="cdot" style="background:#c08a0e"></span>Estrutura da Reunião de MCI — toda segunda, 20 min</div>'
    +'<div style="font-size:12px;color:var(--text2);line-height:2">'
    +'<strong>1.</strong> Abertura: "Nossa MCI é elevar execução de 66% para 90% até 30/06" (2 min)<br>'
    +'<strong>2.</strong> Cada gestor (2 min cada): compromisso passado → entrega → placar → próximo compromisso<br>'
    +'<strong>3.</strong> Líder remove obstáculos identificados — não pune, remove bloqueios<br>'
    +'<strong>4.</strong> Celebração: quem bateu a cadência essa semana?<br>'
    +'<strong>⚠️ Regra:</strong> redemoinho é proibido nessa reunião — tem reunião separada para isso'
    +'</div></div>';
}

async function doRefresh(){
  if(busy)return;busy=true;
  var btn=document.getElementById("btn-ref");btn.disabled=true;btn.classList.add("spin");
  setSt("Buscando dados no ClickUp…","warn");
  try{
    var r=await fetch("/api/refresh",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({periodo:per})
    });
    if(!r.ok){var e=await r.json();throw new Error(e.error||"Erro no servidor");}
    var parsed=await r.json();
    if(parsed.gestores) DADOS=parsed.gestores;
    document.getElementById("hdr-time").textContent="Última atualização: "+fd()+" "+ft();
    setSt("Dados atualizados com sucesso ✓","ok");
    render();
  }catch(e){setSt("Erro: "+e.message,"err");}
  finally{busy=false;btn.disabled=false;btn.classList.remove("spin");}
}

function setSt(m,t){var el=document.getElementById("hdr-status");el.textContent=m;el.className="tb-status "+t;}
</script>
